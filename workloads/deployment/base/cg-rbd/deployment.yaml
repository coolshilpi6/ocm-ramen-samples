---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: quay.io/ocsci/busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" | tee -a /var/logrbd/ramen.log /var/logrbd2/ramen.logg
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 10 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: varlogrbd
              mountPath: /var/logrbd
            - name: varlogrbd2
              mountPath: /var/logrbd2
      volumes:
        - name: varlogrbd
          persistentVolumeClaim:
            claimName: busybox-cg2-pvc1
        - name: varlogrbd2
          persistentVolumeClaim:
            claimName:  busybox-cg2-pvc2
